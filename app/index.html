<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1b2b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Radar">
<meta name="description" content="Radar de oportunidades en vivo: cripto, bolsa, startups, IA, lanzamientos e ideas de negocio.">
<title>Opportunity Radar</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=16">
<script>
  // Tema antes de pintar, para que no parpadee
  try { const m = JSON.parse(localStorage.getItem("radar-theme") || '"auto"');
        const light = m === "light" || (m === "auto" && matchMedia("(prefers-color-scheme: light)").matches);
        if (light) document.documentElement.dataset.theme = "light"; } catch (e) {}
</script>
</head>
<body>
<header class="top" id="top">
  <div class="wrap">
    <div class="bar">
      <h1 class="brand">Radar</h1>
      <span class="live" id="live"><i></i><span id="liveTxt">Conectando…</span></span>
      <span class="spacer"></span>
      <button class="icon-btn" id="refreshBtn" type="button" aria-label="Actualizar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg>
      </button>
      <button class="icon-btn" id="settingsBtn" type="button" aria-label="Ajustes">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      </button>
    </div>
    <div class="ticker" id="ticker" aria-label="Cotizaciones"></div>
    <nav class="tabbar" id="tabbar" role="tablist" aria-label="Categorías"></nav>
  </div>
</header>

<main class="wrap" id="view" aria-live="polite"></main>

<button class="newpill" id="newPill" type="button"></button>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"><div class="sheet-in" id="sheetBody"></div></div>
<div class="toast" id="toast" role="status"></div>

<script src="app.js?v=16"></script>
<script>
  if ("serviceWorker" in navigator && location.protocol === "https:") {
    navigator.serviceWorker.register("sw.js").catch(function () {});
    var reloaded = false;
    navigator.serviceWorker.addEventListener("controllerchange", function () {
      if (reloaded || sessionStorage.getItem("radar-sw-reload")) return;
      reloaded = true; sessionStorage.setItem("radar-sw-reload", "1"); location.reload();
    });
  }
</script>
</body>
</html>
