name: Diagnóstico de fuentes
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/diag/**"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests==2.32.3
      - env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python .github/diag/focus.py
      - name: Publicar muestras (rama diag-samples)
        run: |
          [ -d samples ] || exit 0
          cd samples && git init -q -b diag-samples && git add -A
          git -c user.name=diag -c user.email=diag@users.noreply.github.com commit -q -m "muestras $(date -u +%FT%TZ)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" diag-samples
