name: Opportunity Radar

on:
  schedule:
    - cron: "23 */3 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Qué ejecutar"
        type: choice
        default: auto
        options: [auto, scan, digest, weekly, test-notify]
  push:
    branches: [main]
    paths: ["radar/pipeline.py", "radar/selection.py", "radar/scoring.py", "radar/prompts.py", "radar/collectors.py", "radar/markets.py", "radar/ideas.py"]

permissions:
  contents: write
  actions: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - name: Reparar estructura (solo la primera vez)
        if: hashFiles('radar/pipeline.py') == ''
        run: |
          python3 - <<'PY'
          import os, zlib, struct, math, subprocess
          M = {"radar": "__init__ collectors llm net notify pipeline prompts scoring".split(),
               "tests": ["test_pipeline", "test_scoring"]}
          F = {"radar": [f + ".py" for f in M["radar"]], "tests": [f + ".py" for f in M["tests"]],
               "app": ["index.html", "manifest.webmanifest", "sw.js"], "data": ["opps.json"]}
          for d, fs in F.items():
              os.makedirs(d, exist_ok=True)
              for f in fs:
                  if os.path.exists(f):
                      subprocess.run(["git", "mv", f, d + "/" + f], check=True)
          def png(path, n, pad):
              bg, fg = (14, 22, 34), (52, 211, 153)
              c, R, rows = n / 2, n / 2 * (1 - pad), []
              for y in range(n):
                  row = bytearray([0])
                  for x in range(n):
                      dx, dy = x - c + .5, c - y - .5
                      r, a = math.hypot(dx, dy), math.degrees(math.atan2(dy, dx)) % 360
                      k = 0.0
                      if r < R:
                          if min(abs(r - R * f) for f in (.98, .66, .34)) < n * .012: k = .9
                          if abs(dx) < n * .006 or abs(dy) < n * .006: k = max(k, .35)
                          if 45 <= a <= 100: k = max(k, .55 * (a - 45) / 55)
                          if r < n * .035: k = 1
                          if math.hypot(dx - R * .45, dy - R * .38) < n * .03: k = 1
                      row += bytes(int(bg[i] + (fg[i] - bg[i]) * k) for i in range(3))
                  rows.append(bytes(row))
              def ch(t, d): return struct.pack(">I", len(d)) + t + d + struct.pack(">I", zlib.crc32(t + d) & 0xffffffff)
              os.makedirs(os.path.dirname(path), exist_ok=True)
              open(path, "wb").write(b"\x89PNG\r\n\x1a\n" + ch(b"IHDR", struct.pack(">IIBBBBB", n, n, 8, 2, 0, 0, 0))
                                     + ch(b"IDAT", zlib.compress(b"".join(rows), 9)) + ch(b"IEND", b""))
          for p, n, pad in (("icon-192", 192, .1), ("icon-512", 512, .1), ("maskable-512", 512, .25), ("apple-touch-icon", 180, .12)):
              png("app/icons/%s.png" % p, n, pad)
          PY
          git config user.name "opportunity-radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Colocar archivos en sus carpetas y crear iconos"
          git push

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Pruebas
        run: python -m pytest -q tests

      - name: Feed del pulso (rama live)
        run: git fetch -q --depth=1 origin live && git show FETCH_HEAD:feed.json > /tmp/pulse_feed.json || echo "{}" > /tmp/pulse_feed.json

      - name: Ejecutar el radar
        env:
          PULSE_FEED: /tmp/pulse_feed.json
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER: ${{ secrets.NTFY_SERVER }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: |
          MODE="${{ github.event.inputs.mode }}"
          if [ "${{ github.event_name }}" = "push" ]; then
            MODE=scan
          fi
          python -m radar.pipeline --mode "${MODE:-auto}"

      - name: Seleccionar las mejores y escribir manuales
        if: ${{ !cancelled() && github.event.inputs.mode != 'test-notify' }}
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER: ${{ secrets.NTFY_SERVER }}
          APP_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: python -m radar.selection

      - name: Mercados (acciones y cripto infravaloradas, una vez al día)
        if: ${{ !cancelled() && github.event.inputs.mode != 'test-notify' }}
        continue-on-error: true
        env:
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER: ${{ secrets.NTFY_SERVER }}
          APP_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: python -m radar.markets $([ "${{ github.event_name }}" = "push" ] && echo --force)

      - name: Ideas para copiar (una vez al día)
        if: ${{ !cancelled() && github.event.inputs.mode != 'test-notify' }}
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER: ${{ secrets.NTFY_SERVER }}
          APP_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: python -m radar.ideas $([ "${{ github.event_name }}" = "push" ] && echo --force)

      - name: Guardar datos en el repositorio
        if: ${{ !cancelled() }}
        run: |
          git config user.name "opportunity-radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -m "Radar: datos $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git pull --rebase -X theirs origin main && git push && break; sleep 5; done

      - name: Publicar en la web (lo hace el pulso, que es el único que despliega)
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pulse.yml --ref main -R ${{ github.repository }} || echo "El pulso lo publicará en su próxima ejecución (cada 5 min)"
