name: Pulso en vivo

# Vigila mercados, noticias y redes. GitHub no permite programar más a menudo que cada 5 minutos y en
# esta cuenta apenas ejecuta los programados, así que cada pulso lanza el siguiente:
#  · Si el entorno «pulso-espera» tiene temporizador (Settings → Environments → pulso-espera →
#    Wait timer = 3), la espera la hace GitHub sin ocupar ninguna máquina y la cadena no se corta:
#    un pulso cada ~4-5 minutos, como un cron que funcionara.
#  · Sin temporizador, la pausa se hace dentro del trabajo y la cadena para tras ~1 hora (12 pulsos).
# Cualquier disparo (programado, fin del análisis profundo, cambios en el código, la app) la reanuda.
on:
  schedule:
    - cron: "2-57/5 * * * *"
  workflow_dispatch:
    inputs:
      saltos:
        description: "Pulsos encadenados que quedan"
        required: false
        default: "12"
      encadenado:
        description: "true si lo lanza el pulso anterior"
        required: false
        default: "false"
  push:
    branches: [main]
    paths: ["app/**", "radar/pulse*.py", ".github/workflows/pulse.yml"]

permissions:
  contents: write
  pages: write
  id-token: write
  actions: write

concurrency:
  group: pulse
  cancel-in-progress: false

jobs:
  espera:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.encadenado == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: pulso-espera
    steps:
      - run: echo "Pausa entre pulsos (temporizador del entorno pulso-espera)"

  pulse:
    needs: espera
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Pausa entre pulsos encadenados
        id: pausa
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.encadenado == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          WAIT=$( (gh api "repos/$GITHUB_REPOSITORY/environments/pulso-espera" --jq '[.protection_rules[]? | select(.type == "wait_timer") | .wait_timer] | max // 0' 2>/dev/null || echo 0) | head -n1 )
          CREATED=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .created_at 2>/dev/null || date -u +%Y-%m-%dT%H:%M:%SZ)
          ELAPSED=$(( $(date +%s) - $(date -d "$CREATED" +%s) ))
          echo "Temporizador del entorno: ${WAIT:-0} min; segundos desde que se lanzó este pulso: $ELAPSED"
          if [ "${WAIT:-0}" -ge 1 ] 2>/dev/null || [ "$ELAPSED" -ge 150 ]; then
            echo "temporizador=1" >> "$GITHUB_OUTPUT"
            echo "La pausa la hace el temporizador del entorno: cadena continua."
          elif [ "$ELAPSED" -lt 200 ]; then
            sleep $((200 - ELAPSED))
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Estado anterior (rama live)
        run: |
          mkdir -p live
          if git fetch -q --depth=1 origin live 2>/dev/null; then git archive FETCH_HEAD | tar -x -C live; fi
          ls -la live

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -q requests==2.32.3

      - name: Pulso (mercados, noticias y redes)
        timeout-minutes: 6
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER: ${{ secrets.NTFY_SERVER }}
          GITHUB_TOKEN: ${{ github.token }}
          APP_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: python -m radar.pulse --live live --data data

      - name: Guardar estado (rama live, sin historial)
        continue-on-error: true
        run: |
          cd live
          rm -f *.tmp
          git init -q -b live
          git config user.name "opportunity-radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Pulso $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" live && break; sleep 3; done

      - name: Preparar la web
        run: |
          mkdir -p _site/data
          cp -r app/* _site/
          for f in opps.json status.json runs.json digests.json selected.json markets.json paper.json ideas.json brief.json profiles.json; do [ -f "data/$f" ] && cp "data/$f" _site/data/ || true; done
          # el informe «Para ti» y los perfiles más recientes aunque se hayan guardado después de empezar este pulso
          if git fetch -q --depth=1 origin main 2>/dev/null; then
            for f in brief.json profiles.json; do git show "FETCH_HEAD:data/$f" > "/tmp/$f" 2>/dev/null && cp "/tmp/$f" "_site/data/$f" || true; done
          fi
          [ -f live/feed.json ] && cp live/feed.json _site/data/feed.json || echo '{"items":[]}' > _site/data/feed.json
          [ -f _site/data/opps.json ] || echo "[]" > _site/data/opps.json

      - uses: actions/configure-pages@v5
        continue-on-error: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Esperar a que GitHub registre el artefacto
        run: sleep 8
      - id: deploy
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - name: Reintentar el despliegue si falló
        if: steps.deploy.outcome == 'failure'
        run: sleep 25
      - id: deploy2
        if: steps.deploy.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: ¿Toca el informe «Para ti» o una tanda de ideas «Desde casa»?
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/briefcheck
          for f in brief.json profiles.json; do git show "FETCH_HEAD:data/$f" > "/tmp/briefcheck/$f" 2>/dev/null || rm -f "/tmp/briefcheck/$f"; done
          if python -m radar.brief --data /tmp/briefcheck --check-due; then
            RUNNING=$(gh run list -R "$GITHUB_REPOSITORY" -w brief.yml -L 5 --json status --jq '[.[] | select(.status != "completed")] | length' || echo 1)
            if [ "${RUNNING:-1}" = "0" ]; then gh workflow run brief.yml -R "$GITHUB_REPOSITORY" --ref main && echo "Informe lanzado"; else echo "Ya hay un informe en marcha"; fi
          fi

      - name: Encadenar el siguiente pulso
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LEFT="${{ github.event.inputs.saltos }}"
          if [ "${{ github.event.inputs.encadenado }}" != "true" ] || [ -z "$LEFT" ]; then LEFT=12; fi
          if [ "${{ steps.pausa.outputs.temporizador }}" = "1" ]; then LEFT=999; else LEFT=$((LEFT-1)); if [ "$LEFT" -gt 11 ]; then LEFT=11; fi; fi
          if [ "$LEFT" -le 0 ]; then echo "Fin de la cadena: el siguiente pulso llegará con el próximo disparo."; exit 0; fi
          WAITING=$(gh run list -R "$GITHUB_REPOSITORY" -w pulse.yml -L 20 --json status,databaseId --jq "[.[] | select(.databaseId != $GITHUB_RUN_ID) | select(.status==\"queued\" or .status==\"pending\" or .status==\"waiting\" or .status==\"requested\" or .status==\"in_progress\")] | length")
          if [ "${WAITING:-0}" != "0" ]; then echo "Ya hay otro pulso en marcha o en cola: no se encadena."; exit 0; fi
          gh workflow run pulse.yml -R "$GITHUB_REPOSITORY" --ref main -f saltos="$LEFT" -f encadenado=true && echo "Encadenado (quedan $LEFT)"
